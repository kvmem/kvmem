name: Server and UI compatibility

on:
  pull_request:
  push:
    branches: [master, feat/multi-backend-framework]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_ci: ${{ steps.classify.outputs.run_ci }}
      run_cuda: ${{ steps.classify.outputs.run_cuda }}
      run_native: ${{ steps.classify.outputs.run_native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify documentation-only changes
        id: classify
        run: python3 .github/scripts/classify_changes.py
      - name: Test CI change detection
        if: steps.classify.outputs.run_ci == 'true'
        run: python3 tests/test_ci_changes.py
      - name: Check portable validation and public evidence
        run: |
          python3 scripts/public_evidence.py --check
          python3 tests/test_validation_portability.py
          python3 tests/test_public_evidence.py
          python3 tests/test_multi_needle.py
          python3 -m unittest discover -s scripts -p test_native_stats.py
  console:
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Use a canonical Windows test directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:RUNNER_TEMP 'kvmem-console-tests'
          New-Item -ItemType Directory -Path $testTemp -Force | Out-Null
          "TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: python -m pip install -r scripts/requirements-console.txt
      - name: Test launcher and console without compiling an engine
        shell: bash
        run: |
          python -m unittest discover -s tests -p "test_launcher_plan.py"
          python -m unittest discover -s tests -p "test_launcher_export.py"
          python -m unittest discover -s tests -p "test_launcher_process.py"
          python -m unittest discover -s tests -p "test_launcher_services.py"
          python -m unittest discover -s tests -p "test_launcher_package.py"
          python -m unittest discover -s tests -p "test_radiance_launcher.py"
          python tests/test_local_console.py
          python -m unittest discover -s tests -p "test_auto_budget.py"
          python -m unittest discover -s tests -p "test_console_memory.py"
          python tests/test_console_logs.py
          python tests/test_console_chat.py
          python tests/test_model_health.py
          python tests/test_one_click.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser and launcher syntax checks
        shell: bash
        run: |
          node --check ui/monitor/launcher.js
          npm ci --prefix ui
          npx --prefix ui playwright install --with-deps chromium
          npm test --prefix ui
  host-linux:
    needs: changes
    if: needs.changes.outputs.run_native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/test_launcher_key_file.py
      - run: python3 scripts/test_start_server.py
      - run: python3 scripts/test_build_rocm.py
      - name: Test local console and monitor packaging
        run: |
          python3 tests/test_local_console.py
          python3 tests/test_console_logs.py
          python3 tests/test_model_health.py
          python3 tests/test_prepare_backends.py
          python3 tests/test_console_chat.py
          python3 tests/test_one_click.py
          python3 tests/test_webui_builder.py
      - name: Prepare pinned llama.cpp integration
        run: |
          python3 scripts/prepare-backends.py --backend llamacpp
          python3 scripts/prepare-backends.py --backend llamacpp --check
      - name: Validate PolyStrata integration patch and adapters
        run: |
          python3 scripts/prepare-backends.py --backend polystrata
          python3 scripts/prepare-backends.py --backend polystrata --check
          python3 -m pip install Jinja2==3.1.6 regex==2026.9.10
          python3 -m unittest discover -s tools/polystrata -p test_wrapper.py
          python3 -m unittest discover -s tools/polystrata -p test_backend_launch.py
          python3 -m unittest discover -s tools/polystrata -p test_build_contract.py
          python3 -m unittest discover -s tools/polystrata -p test_image_query.py
          (cd backends/polystrata && python3 -m unittest serve.test_kvmem serve.test_server.VisionShutdown)
          python3 -m unittest discover -s tools/polystrata -p test_assets.py
          python3 -m unittest discover -s tools/polystrata -p test_benchmark_evidence.py
          python3 -m unittest discover -s tools/polystrata -p test_monitor.py
          python3 -m unittest discover -s tools/polystrata -p test_ui_contract.py
          python3 -m unittest discover -s tools/polystrata -p test_console_routes.py
          node ui/test-polystrata-contract.cjs
          node ui/test-polystrata-stream.cjs
      - name: Configure host and model-free server tests
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DKVMEM_BUILD_LLAMA=OFF -DKVMEM_BUILD_SERVER_TESTS=ON
          -DGGML_NATIVE=OFF
          -DGGML_CUDA=OFF -DGGML_HIP=OFF
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure --no-tests=error
      - run: bash scripts/test_server_portable.sh build/portable
  host-windows:
    needs: changes
    if: needs.changes.outputs.run_native == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use a canonical Windows test directory
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:RUNNER_TEMP 'kvmem-host-tests'
          New-Item -ItemType Directory -Path $testTemp -Force | Out-Null
          "TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: python scripts/test_build_rocm.py
      - name: Test portable validation and evidence export
        run: |
          python tests/test_validation_portability.py
          python tests/test_public_evidence.py
      - name: Test local console and monitor packaging
        run: |
          python tests/test_local_console.py
          python tests/test_console_logs.py
          python tests/test_model_health.py
          python tests/test_prepare_backends.py
          python tests/test_console_chat.py
          python tests/test_windows_worker_args.py
          python tests/test_one_click.py
          python tests/test_webui_builder.py
      - name: Prepare pinned llama.cpp integration
        run: |
          python scripts/prepare-backends.py --backend llamacpp
          python scripts/prepare-backends.py --backend llamacpp --check
      - name: Configure host and model-free server tests
        run: >-
          cmake -S . -B build -A x64
          -DKVMEM_BUILD_LLAMA=OFF -DKVMEM_BUILD_SERVER_TESTS=ON
          -DGGML_NATIVE=OFF
          -DGGML_CUDA=OFF -DGGML_HIP=OFF
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Test native PowerShell launcher
        shell: powershell
        run: ./scripts/windows/test-launcher.ps1
      - name: Test Windows packaging
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | Select-Object -First 1
          if (!$dumpbin) { throw 'MSVC dumpbin was not found' }
          $env:PATH = "$(Split-Path -Parent $dumpbin);$env:PATH"
          ./scripts/windows/test-package.ps1 -TestExe "$PWD/build/bin/Release/kvmem_store_test.exe"
  cuda-build-linux:
    needs: changes
    if: needs.changes.outputs.run_cuda == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates build-essential cmake ninja-build libssl-dev python3 time ccache zstd
      - uses: actions/checkout@v4
      - name: Trust the checked-out workspace in the CUDA container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Prepare pinned llama.cpp integration
        run: |
          python3 scripts/prepare-backends.py --backend llamacpp
          python3 scripts/prepare-backends.py --backend llamacpp --check
      - name: Identify the compiler toolchain
        id: toolchain
        run: |
          c++ --version > "$RUNNER_TEMP/compiler-versions.txt"
          nvcc --version >> "$RUNNER_TEMP/compiler-versions.txt"
          ccache --version >> "$RUNNER_TEMP/compiler-versions.txt"
          sha256sum "$(command -v c++)" "$(command -v nvcc)" "$(command -v ccache)" >> "$RUNNER_TEMP/compiler-versions.txt"
          printf 'id=%s\n' "$(sha256sum "$RUNNER_TEMP/compiler-versions.txt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          # Keep one snapshot per build/kernel configuration, rather than per commit.
          key: cuda12.8.1-120a-ccache-v1-${{ steps.toolchain.outputs.id }}-${{ hashFiles('.github/workflows/server-compat.yml', 'CMakeLists.txt', 'kvmem/CMakeLists.txt', 'backends/versions.json', 'backends/patches/**', 'backends/llamacpp/ggml/src/ggml-cuda/**') }}
          restore-keys: |
            cuda12.8.1-120a-ccache-v1-${{ steps.toolchain.outputs.id }}-
            cuda12.8.1-120a-ccache-v1-
      - name: Prepare the CUDA driver stub for linking
        run: |
          mkdir -p "$RUNNER_TEMP/cuda-driver-stubs"
          ln -s /usr/local/cuda/lib64/stubs/libcuda.so "$RUNNER_TEMP/cuda-driver-stubs/libcuda.so.1"
      - name: Configure the complete CUDA build
        # Compile for Blackwell without probing for a GPU on the standard runner.
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=ON -DKVMEM_BUILD_LLAMA=ON
          -DGGML_CUDA=ON -DGGML_NATIVE=OFF
          -DGGML_CCACHE=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache
          -DCMAKE_CUDA_ARCHITECTURES=120a-real
          -DCMAKE_EXE_LINKER_FLAGS="-Wl,-rpath-link,$RUNNER_TEMP/cuda-driver-stubs"
      - name: Build and link all targets
        run: |
          nproc
          free -h
          ccache --zero-stats
          /usr/bin/time -v cmake --build build --parallel 2
          if [ -r /sys/fs/cgroup/memory.peak ]; then
            printf 'Container peak memory (bytes): '
            cat /sys/fs/cgroup/memory.peak
          fi
      - name: Compiler cache statistics
        if: ${{ always() }}
        run: ccache --show-stats
  polystrata-cuda-build-linux:
    needs: changes
    if: needs.changes.outputs.run_cuda == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # PolyStrata recommends CUDA >= 13 for Blackwell; do not inherit the
    # llama.cpp job's CUDA 12.8 toolchain.
    container: nvidia/cuda:13.2.0-devel-ubuntu24.04
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-polystrata
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates build-essential cmake ninja-build python3 time ccache zstd
      - uses: actions/checkout@v4
      - name: Trust the checked-out workspace in the CUDA container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Prepare and verify pinned PolyStrata integration
        run: |
          python3 scripts/prepare-backends.py --backend polystrata
          python3 scripts/prepare-backends.py --backend polystrata --check
      - name: Identify the compiler toolchain
        id: toolchain
        run: |
          c++ --version > "$RUNNER_TEMP/polystrata-compiler-versions.txt"
          nvcc --version >> "$RUNNER_TEMP/polystrata-compiler-versions.txt"
          ccache --version >> "$RUNNER_TEMP/polystrata-compiler-versions.txt"
          sha256sum "$(command -v c++)" "$(command -v nvcc)" "$(command -v ccache)" >> "$RUNNER_TEMP/polystrata-compiler-versions.txt"
          printf 'id=%s\n' "$(sha256sum "$RUNNER_TEMP/polystrata-compiler-versions.txt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: polystrata-cuda13.2.0-120a-v1-${{ steps.toolchain.outputs.id }}-${{ hashFiles('.github/workflows/server-compat.yml', 'kvmem/CMakeLists.txt', 'backends/versions.json', 'backends/patches/polystrata*.patch') }}
          restore-keys: |
            polystrata-cuda13.2.0-120a-v1-${{ steps.toolchain.outputs.id }}-
      - name: Prepare the CUDA driver stub for linking
        run: |
          mkdir -p "$RUNNER_TEMP/polystrata-driver-stubs"
          ln -s /usr/local/cuda/lib64/stubs/libcuda.so "$RUNNER_TEMP/polystrata-driver-stubs/libcuda.so.1"
      - name: Configure PolyStrata against this checkout's KVMem core
        # GGML is fetched at the commit pinned in PolyStrata's CMakeLists.txt.
        # A fixed architecture avoids probing for a GPU on the hosted runner.
        run: |
          set -o pipefail
          cmake -S backends/polystrata -B build-polystrata -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSTRATA_ENABLE_CUDA=ON \
            -DSTRATA_BUILD_TESTS=OFF -DSTRATA_PORTABLE=ON \
            -DSTRATA_KVMEM_SOURCE_DIR="$GITHUB_WORKSPACE/kvmem" \
            -DCMAKE_CUDA_ARCHITECTURES=120a-real \
            -DGGML_CCACHE=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-rpath-link,$RUNNER_TEMP/polystrata-driver-stubs" \
            2>&1 | tee polystrata-configure.log
      - name: Build and link worker and native regression targets
        run: |
          set -o pipefail
          nproc
          free -h
          ccache --zero-stats
          /usr/bin/time -v cmake --build build-polystrata --parallel 8 --target \
            strata-poly poly_gdn_mma_state_test poly_kvmem_kernel_test poly_kvmem_mtp_test \
            poly_kvmem_history_test poly_kvmem_sessions_test poly_elastic_test \
            2>&1 | tee polystrata-build.log
      - name: Run model-free host policy tests
        # Do not run kernel/MTP tests on a runner without an NVIDIA GPU/model.
        run: >-
          ctest --test-dir build-polystrata --output-on-failure --no-tests=error
          -R '^poly_kvmem_(history|sessions)_test$'
      - name: Compiler cache statistics
        if: ${{ always() }}
        run: ccache --show-stats
      - name: Preserve native build and test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: polystrata-native-ci-logs
          retention-days: 7
          path: |
            polystrata-configure.log
            polystrata-build.log
            build-polystrata/CMakeCache.txt
            build-polystrata/CMakeFiles/CMakeConfigureLog.yaml
            build-polystrata/Testing/Temporary/LastTest.log
  polystrata-hip-build-linux:
    needs: changes
    if: needs.changes.outputs.run_native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [gfx1100, gfx1201]
    # Official ROCm 7.2.4 amd64 image. No GPU is exposed; this proves linkage,
    # not AMD inference correctness. Architectures are selected explicitly.
    container: rocm/dev-ubuntu-24.04:7.2.4@sha256:bdc8e61026cbb844ede93d44d2c50055f51ebb2041906b60182bf3bee3139054
    defaults:
      run:
        shell: bash
    env:
      HIP_VISIBLE_DEVICES: ''
      ROCR_VISIBLE_DEVICES: ''
      CCACHE_DIR: ${{ github.workspace }}/.ccache-polystrata-hip
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Install build tools and pinned ROCm BLAS development packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates cmake ninja-build python3 ccache zstd \
            hipblas-dev=3.2.0.70204-93~24.04 rocblas-dev=5.2.0.70204-93~24.04 hipblaslt-dev=1.2.2.70204-93~24.04
      - uses: actions/checkout@v4
      - name: Prepare and verify pinned PolyStrata integration
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/prepare-backends.py --backend polystrata
          python3 scripts/prepare-backends.py --backend polystrata --check
          /opt/rocm/llvm/bin/clang++ --version | tee polystrata-hip-toolchain.log
          dpkg-query -W 'hip*' 'roc*' >> polystrata-hip-toolchain.log
      - uses: actions/cache@v4
        with:
          path: .ccache-polystrata-hip
          key: polystrata-hip7.2.4-bdc8e610-${{ matrix.arch }}-v1-${{ hashFiles('.github/workflows/server-compat.yml', 'kvmem/CMakeLists.txt', 'backends/versions.json', 'backends/patches/polystrata*.patch') }}
          restore-keys: |
            polystrata-hip7.2.4-bdc8e610-${{ matrix.arch }}-v1-
      - name: Configure without probing AMD hardware
        run: |
          set -o pipefail
          cmake -S backends/polystrata -B build-polystrata-hip -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSTRATA_ENABLE_CUDA=OFF -DSTRATA_ENABLE_HIP=ON \
            -DSTRATA_BUILD_TESTS=OFF -DSTRATA_PORTABLE=ON \
            -DCMAKE_C_COMPILER=/opt/rocm/llvm/bin/clang -DCMAKE_CXX_COMPILER=/opt/rocm/llvm/bin/clang++ \
            -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang++ \
            -DCMAKE_PREFIX_PATH=/opt/rocm -DCMAKE_HIP_ARCHITECTURES=${{ matrix.arch }} \
            -DSTRATA_KVMEM_SOURCE_DIR="$GITHUB_WORKSPACE/kvmem" \
            -DGGML_CCACHE=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_HIP_COMPILER_LAUNCHER=ccache \
            2>&1 | tee polystrata-hip-configure.log
      - name: Inspect, compile and link all KVMem consumers
        run: |
          set -o pipefail
          targets=(strata-poly poly_kvmem_kernel_test poly_kvmem_mtp_test poly_elastic_test poly_kvmem_history_test poly_kvmem_sessions_test)
          ninja -C build-polystrata-hip -n -d explain "${targets[@]}" 2>&1 | tee polystrata-hip-plan.log
          free -h
          df -h .
          cmake --build build-polystrata-hip --parallel 8 --target "${targets[@]}" 2>&1 | tee polystrata-hip-build.log
          # Do not execute HIP binaries without an AMD GPU.
      - name: Preserve HIP build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: polystrata-hip-${{ matrix.arch }}-logs
          retention-days: 7
          path: |
            polystrata-hip-*.log
            build-polystrata-hip/CMakeCache.txt
            build-polystrata-hip/CMakeFiles/CMakeConfigureLog.yaml
  radiance-host-contracts:
    needs: changes
    if: needs.changes.outputs.run_native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the complete pinned Radiance patch chain
        shell: bash
        run: |
          python backends/radiance/tools/prepare_native.py --destination "$RUNNER_TEMP/radiance-native"
          python -c 'import pathlib,sys; sys.path.insert(0,"backends/radiance/tools"); from source_identity import source_revision; print(source_revision(pathlib.Path(sys.argv[1])))' "$RUNNER_TEMP/radiance-native"
      - name: Test platform, source identity and evidence adapters
        run: python -m unittest discover -s backends/radiance/tests -p "*test.py"
      - name: Build and run portable C++ contracts without HIP
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S . -B build-radiance-host -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DKVMEM_BUILD_LLAMA=OFF -DKVMEM_BUILD_SERVER_TESTS=OFF \
            -DKVMEM_BUILD_RADIANCE=ON -DRADIANCE_SOURCE_DIR="$RUNNER_TEMP/radiance-native"
          ninja -C build-radiance-host -n -d explain
          cmake --build build-radiance-host --parallel 8
          ctest --test-dir build-radiance-host --output-on-failure --no-tests=error
  ninfer-pinned-sources:
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare and verify the pinned ninfer-all integration
        run: |
          python scripts/prepare-backends.py --backend ninfer
          python scripts/prepare-backends.py --backend ninfer --check
      - name: Verify repeated preparation
        run: |
          python scripts/prepare-backends.py --backend ninfer
          python scripts/prepare-backends.py --backend ninfer --check
  # Keep required status names; only verified documentation changes may skip builds.
  host-and-server-units-linux:
    if: ${{ always() }}
    needs: [changes, console, host-linux, host-windows, cuda-build-linux, polystrata-cuda-build-linux, polystrata-hip-build-linux, radiance-host-contracts, ninfer-pinned-sources]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all host and build checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_CI: ${{ needs.changes.outputs.run_ci }}
          RUN_CUDA: ${{ needs.changes.outputs.run_cuda }}
          RUN_NATIVE: ${{ needs.changes.outputs.run_native }}
          CONSOLE_RESULT: ${{ needs.console.result }}
          LINUX_RESULT: ${{ needs.host-linux.result }}
          WINDOWS_RESULT: ${{ needs.host-windows.result }}
          CUDA_RESULT: ${{ needs.cuda-build-linux.result }}
          POLYSTRATA_CUDA_RESULT: ${{ needs.polystrata-cuda-build-linux.result }}
          POLYSTRATA_HIP_RESULT: ${{ needs.polystrata-hip-build-linux.result }}
          RADIANCE_RESULT: ${{ needs.radiance-host-contracts.result }}
          NINFER_RESULT: ${{ needs.ninfer-pinned-sources.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$RUN_CI" = false ]; then
            echo 'Documentation only: compilation and tests skipped.'
            exit 0
          fi
          test "$RUN_CI" = true
          test "$CONSOLE_RESULT" = success
          if [ "$RUN_NATIVE" = true ]; then
            test "$LINUX_RESULT" = success
            test "$WINDOWS_RESULT" = success
            test "$POLYSTRATA_HIP_RESULT" = success
            test "$RADIANCE_RESULT" = success
          else
            test "$RUN_NATIVE" = false
            test "$LINUX_RESULT" = skipped
            test "$WINDOWS_RESULT" = skipped
            test "$POLYSTRATA_HIP_RESULT" = skipped
            test "$RADIANCE_RESULT" = skipped
          fi
          if [ "$RUN_CUDA" = true ]; then
            test "$CUDA_RESULT" = success
            test "$POLYSTRATA_CUDA_RESULT" = success
          else
            test "$RUN_CUDA" = false
            test "$CUDA_RESULT" = skipped
            test "$POLYSTRATA_CUDA_RESULT" = skipped
          fi
          test "$NINFER_RESULT" = success
  ui-linux:
    # Preserve both matrix check names required by master, even for documentation.
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        mode: [lightweight, full]
    steps:
      - name: Require successful change detection
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_ci == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.run_ci == 'true'
        with:
          node-version: '24'
      - run: python3 tests/test_webui_builder.py
        if: needs.changes.outputs.run_ci == 'true'
      - name: Install console browser tests
        if: needs.changes.outputs.run_ci == 'true' && matrix.mode == 'lightweight'
        working-directory: ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test console and monitor in Chromium
        if: needs.changes.outputs.run_ci == 'true' && matrix.mode == 'lightweight'
        working-directory: ui
        run: npm test
      - name: Build UI
        if: needs.changes.outputs.run_ci == 'true'
        env:
          UI_MODE: ${{ matrix.mode }}
        run: |
          if [ "$UI_MODE" = full ]; then
            python3 scripts/build-webui.py --full-ui
          else
            python3 scripts/build-webui.py
          fi
      - name: Test unified chat against all backend settings
        if: needs.changes.outputs.run_ci == 'true' && matrix.mode == 'lightweight'
        working-directory: ui
        run: |
          node test-chat-props.cjs
          node test-chat-history.cjs
          node test-chat-attachments.cjs
          node test-chat-actions.cjs
          node test-chat-background.cjs
          node test-chat-metrics.cjs
      - name: Documentation-only result
        if: needs.changes.outputs.run_ci == 'false'
        run: echo 'Documentation only; UI tests and builds skipped.'
