name: hipfire upstream merge drill

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hipfire-merge-drill
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_NET_RETRY: '2'

jobs:
  drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Reconstruct the pinned series and merge current upstream
        run: >-
          python3 scripts/hipfire_merge_drill.py
          --summary "$GITHUB_STEP_SUMMARY"
          --json merge-drill.json
          --cargo-timeout 1800
      - name: Report the conflict surface
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("merge-drill.json")
          if not path.is_file():
              print("::error title=hipfire merge drill::the drill did not write a report")
              sys.exit(1)
          report = json.loads(path.read_text(encoding="utf-8"))
          conflicts = report.get("conflicts") or {}
          files = conflicts.get("files") or []
          if len(files) > 8:
              print(
                  f"::warning title=hipfire merge drill::"
                  f"{len(files)} conflicting files; schedule a deliberate rebase"
              )
          status = report.get("status")
          if status in {"patch-failed", "check-failed", "tree-mismatch", "merge-failed", "error"}:
              print(f"::error title=hipfire merge drill::status is {status}")
              sys.exit(1)
          print(f"merge drill status: {status}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hipfire-merge-drill
          path: merge-drill.json
          if-no-files-found: warn
