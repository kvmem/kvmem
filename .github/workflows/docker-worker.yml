name: NInfer Docker worker

on:
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.dockerignore
      - 'scripts/docker/**'
      - '.github/workflows/docker-worker.yml'
  push:
    branches: [master]
    paths:
      - Dockerfile
      - Dockerfile.dockerignore
      - 'scripts/docker/**'
      - '.github/workflows/docker-worker.yml'

permissions:
  contents: read

jobs:
  docker-worker-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check build script syntax
        run: bash -n scripts/docker/build.sh
      - name: Prepare and verify NInfer sources
        run: |
          python3 scripts/prepare-backends.py --backend ninfer
          python3 scripts/prepare-backends.py --backend ninfer --check
      - name: Check worker Dockerfile
        run: docker buildx build --check --progress=plain --build-arg CUDA_ARCH=120a .
